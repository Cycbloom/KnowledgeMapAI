name: Setup Environment
description: Checkout code, setup Node.js 20 with npm cache, and install dependencies

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci
      shell: bash