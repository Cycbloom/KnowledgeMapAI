name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Weekly flaky test detection: every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allow manual trigger for flaky detection or other ad-hoc runs

jobs:
  validate:
    name: Validate (Lint, Typecheck, Test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Generated Types
        run: npm run db:check-types

      - name: Lint
        run: npm run lint

      - name: Type Check (Web)
        run: npm run check

      - name: Type Check (Electron)
        run: npm run check:electron

      - name: Security Audit
        run: |
          # Run npm audit and filter for high/critical vulnerabilities.
          # Known non-critical vulnerabilities can be added to the whitelist below.
          npm audit --omit=dev --json > audit-result.json 2>/dev/null || true
          node -e '
            const fs = require("fs");
            const audit = JSON.parse(fs.readFileSync("./audit-result.json", "utf8"));
            const vulnerabilities = audit.vulnerabilities || {};
            // Whitelist of package names with known accepted vulnerabilities.
            // Add entries here when a vulnerability is reviewed and deemed non-exploitable
            // in this project context (e.g. dev-only dependency, not reachable at runtime).
            const whitelist = new Set([
              // Example: "some-package"
            ]);
            const failing = Object.entries(vulnerabilities).filter(([name, v]) => {
              if (whitelist.has(name)) return false;
              return v.severity === "critical" || v.severity === "high";
            });
            if (failing.length > 0) {
              console.error("High/Critical vulnerabilities found (not whitelisted):");
              failing.forEach(([name, v]) => {
                const via = (v.via || []).map(x => typeof x === "string" ? x : x.title).join(", ");
                console.error("  - " + name + ": " + v.severity + " (via " + via + ")");
              });
              process.exit(1);
            }
            console.log("Audit passed: no non-whitelisted high/critical vulnerabilities");
          '

      - name: Rebuild native modules for system Node
        # postinstall 的 electron-rebuild 把 better-sqlite3 编译为 Electron 的 V8 版本，
        # 但 vitest 运行在系统 Node.js 上，原生模块二进制不兼容（NODE_MODULE_VERSION 不匹配）。
        # 在运行测试前为系统 Node.js 重新编译。
        run: npm rebuild better-sqlite3

      - name: Run Tests (with coverage)
        run: npm run test:coverage

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start Supabase
        run: |
          supabase start
          supabase db reset
        env:
          # Supabase CLI 需要 Docker（GitHub Actions ubuntu-latest 已预装）
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Extract Supabase Keys
        # Supabase CLI 每次启动生成随机的 JWT_SECRET，不能使用固定 demo key。
        # 从 supabase status 提取实际密钥，并写入 .env.development.local
        # 供 api/supabase.ts 的 dotenv 加载（override:true）。
        run: |
          STATUS_JSON=$(supabase status -o json)
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.anonKey // empty')
          SERVICE_KEY=$(echo "$STATUS_JSON" | jq -r '.serviceKey // empty')
          JWT_SECRET=$(echo "$STATUS_JSON" | jq -r '.jwtSecret // empty')

          # 兼容旧版 CLI：JSON 解析失败时回退到文本解析
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_KEY" ]; then
            STATUS_TEXT=$(supabase status)
            ANON_KEY=$(echo "$STATUS_TEXT" | grep -oP 'anon key:\s*\K\S+' || echo "")
            SERVICE_KEY=$(echo "$STATUS_TEXT" | grep -oP 'service_role key:\s*\K\S+' || echo "")
            JWT_SECRET=$(echo "$STATUS_TEXT" | grep -oP 'JWT secret:\s*\K\S+' || echo "")
          fi

          if [ -z "$SERVICE_KEY" ]; then
            echo "ERROR: 无法提取 service role key"
            supabase status
            exit 1
          fi

          echo "ANON_KEY length: ${#ANON_KEY}"
          echo "SERVICE_KEY length: ${#SERVICE_KEY}"

          # 写入 GITHUB_ENV（test:db 直接读取这些变量）
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV
          if [ -n "$JWT_SECRET" ]; then
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET" >> $GITHUB_ENV
          fi

          # 写入 .env.development.local（api/supabase.ts 以 override:true 加载）
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" > .env.development.local
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> .env.development.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> .env.development.local
          if [ -n "$JWT_SECRET" ]; then
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET" >> .env.development.local
          fi

      - name: Run Database Tests
        run: npm run test:db
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Build
        run: npm run build

      - name: Build Size Report
        run: |
          echo "=== Build Size Report ==="
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "dist/ directory:"
          du -sh dist/ 2>/dev/null || echo "dist/ not found"
          echo ""
          echo "Detailed breakdown:"
          du -sh dist/*/ 2>/dev/null || echo "No subdirectories in dist/"
          echo ""
          echo "Total files count:"
          find dist/ -type f 2>/dev/null | wc -l || echo "0"

  e2e-tests:
    name: E2E Tests (Playwright - Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Don't cancel other shards on failure — useful for debugging flaky tests
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: |
          supabase start
          supabase db reset

      - name: Extract Supabase Keys
        # Supabase CLI 每次启动生成随机的 JWT_SECRET 和新格式的密钥（sb_secret_...），
        # 不能再使用旧版固定的 demo key。从 supabase status 输出提取实际密钥。
        # 同时写入 .env.local 供 API 服务器和前端读取。
        run: |
          # 获取 supabase status 的完整输出（JSON 格式更可靠）
          STATUS_JSON=$(supabase status -o json)
          echo "Supabase status JSON: $STATUS_JSON"

          # 提取密钥（使用 jq 解析 JSON）
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.anonKey // empty')
          SERVICE_KEY=$(echo "$STATUS_JSON" | jq -r '.serviceKey // empty')
          JWT_SECRET=$(echo "$STATUS_JSON" | jq -r '.jwtSecret // empty')

          # 兼容旧版 CLI：如果 JSON 中没有，回退到从文本输出提取
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_KEY" ]; then
            echo "JSON 解析失败，回退到文本解析"
            STATUS_TEXT=$(supabase status)
            ANON_KEY=$(echo "$STATUS_TEXT" | grep -oP 'anon key:\s*\K\S+' || echo "")
            SERVICE_KEY=$(echo "$STATUS_TEXT" | grep -oP 'service_role key:\s*\K\S+' || echo "")
            JWT_SECRET=$(echo "$STATUS_TEXT" | grep -oP 'JWT secret:\s*\K\S+' || echo "")
          fi

          if [ -z "$SERVICE_KEY" ]; then
            echo "ERROR: 无法提取 service role key"
            supabase status
            exit 1
          fi

          echo "ANON_KEY length: ${#ANON_KEY}"
          echo "SERVICE_KEY length: ${#SERVICE_KEY}"
          echo "JWT_SECRET length: ${#JWT_SECRET}"

          # 写入 GITHUB_ENV 供后续步骤使用
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV
          if [ -n "$JWT_SECRET" ]; then
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET" >> $GITHUB_ENV
          fi

          # 也写入 .env.development.local 供 API 服务器的 dotenv 加载
          # （api/supabase.ts 以 override:true 加载 .env.development.local，
          #   覆盖 .env.development 中的固定密钥）
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" > .env.development.local
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> .env.development.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> .env.development.local
          if [ -n "$JWT_SECRET" ]; then
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET" >> .env.development.local
          fi

      - name: Run E2E Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          DISABLE_RATE_LIMIT: 'true'
          TEST_USER_EMAIL: test@example.com
          TEST_USER_PASSWORD: test123456

      - name: Upload Blob Report (Shard ${{ matrix.shardIndex }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 7

      - name: Upload Test Screenshots (Shard ${{ matrix.shardIndex }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7

  merge-reports:
    name: Merge E2E Reports
    if: always()
    needs: [e2e-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download All Blob Reports
        uses: actions/download-artifact@v4
        with:
          # Match all blob-report-* artifacts and unpack them into ./blob-report
          pattern: blob-report-*
          merge-multiple: true
          path: blob-report

      - name: Merge Blob Reports into HTML
        run: npx playwright merge-reports --reporter html ./blob-report

      - name: Upload Merged HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: playwright-report
          retention-days: 30

  flaky-detection:
    name: Flaky Test Detection
    # Runs weekly on Sunday 02:00 UTC + manual trigger
    # Repeats each E2E test 3 times to surface flaky tests.
    # Quarantine flaky tests by moving them to e2e/quarantine/ (see e2e/quarantine/.gitkeep).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests (repeat-each=3 for flaky detection)
        run: npm run test:flaky

      - name: Upload Flaky Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-report
          path: playwright-report/
          retention-days: 30

