name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Weekly flaky test detection: every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allow manual trigger for flaky detection or other ad-hoc runs

jobs:
  lint-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Generated Types
        run: npm run db:check-types

      - name: Lint
        run: npm run lint

      - name: Type Check (Web)
        run: npm run check

      - name: Type Check (Electron)
        run: npm run check:electron

  unit-test:
    name: Unit Tests (with coverage)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Rebuild native modules for system Node
        # postinstall 的 electron-rebuild 把 better-sqlite3 编译为 Electron 的 V8 版本，
        # 但 vitest 运行在系统 Node.js 上，原生模块二进制不兼容（NODE_MODULE_VERSION 不匹配）。
        # 在运行测试前为系统 Node.js 重新编译。
        run: npm rebuild better-sqlite3

      - name: Run Tests (with coverage)
        run: npm run test:coverage

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start Supabase
        run: |
          supabase start
          supabase db reset
        env:
          # Supabase CLI 需要 Docker（GitHub Actions ubuntu-latest 已预装）
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Extract Supabase Keys
        # Supabase CLI 每次启动生成随机的 JWT_SECRET，不能使用固定 demo key。
        # 从 supabase status 文本输出提取实际密钥（新 CLI 用 sb_publishable_/sb_secret_，
        # 旧 CLI 用 JWT eyJ... 格式），写入 .env.development.local 供 api/supabase.ts 加载。
        run: |
          STATUS_TEXT=$(supabase status)

          # 新版 CLI 格式：sb_publishable_ / sb_secret_ 密钥（表格中显示）
          ANON_KEY=$(echo "$STATUS_TEXT" | grep -oP 'sb_publishable_[A-Za-z0-9_-]+' | head -1)
          SERVICE_KEY=$(echo "$STATUS_TEXT" | grep -oP 'sb_secret_[A-Za-z0-9_-]+' | head -1)

          # 旧版 CLI 格式：JWT 密钥（eyJ...），带 "anon key:" / "service_role key:" 标签
          if [ -z "$ANON_KEY" ]; then
            ANON_KEY=$(echo "$STATUS_TEXT" | grep -i 'anon' | grep -oP 'eyJ[A-Za-z0-9._-]+' | head -1)
          fi
          if [ -z "$SERVICE_KEY" ]; then
            SERVICE_KEY=$(echo "$STATUS_TEXT" | grep -i 'service' | grep -oP 'eyJ[A-Za-z0-9._-]+' | head -1)
          fi

          if [ -z "$SERVICE_KEY" ]; then
            echo "ERROR: 无法提取 service role key"
            echo "=== supabase status output ==="
            echo "$STATUS_TEXT"
            exit 1
          fi

          echo "ANON_KEY length: ${#ANON_KEY}"
          echo "SERVICE_KEY length: ${#SERVICE_KEY}"
          echo "ANON_KEY prefix: ${ANON_KEY:0:15}"
          echo "SERVICE_KEY prefix: ${SERVICE_KEY:0:15}"

          # 从 Docker 容器提取 JWT_SECRET（新 CLI 不在 status 输出中显示）
          # 遍历所有运行中的容器，找到包含 JWT_SECRET 环境变量的容器
          JWT_SECRET=""
          for container in $(docker ps --format "{{.Names}}"); do
            secret=$(docker exec "$container" printenv JWT_SECRET 2>/dev/null || echo "")
            if [ -n "$secret" ]; then
              JWT_SECRET="$secret"
              echo "Found JWT_SECRET in container: $container"
              break
            fi
          done
          if [ -n "$JWT_SECRET" ]; then
            echo "JWT_SECRET length: ${#JWT_SECRET}"
          else
            echo "JWT_SECRET: not found (auth API JWT verification may be limited)"
          fi

          # 写入 GITHUB_ENV（test:db 直接读取这些变量）
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV
          if [ -n "$JWT_SECRET" ]; then
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET" >> $GITHUB_ENV
          fi

          # 写入 .env.development.local（api/supabase.ts 以 override:true 加载）
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" > .env.development.local
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> .env.development.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> .env.development.local
          if [ -n "$JWT_SECRET" ]; then
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET" >> .env.development.local
          fi

      - name: Run Database Tests
        run: npm run test:db
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build (Web)
        run: npm run build

      - name: Build (Electron)
        run: npm run build:electron

      - name: Build Size Report
        run: |
          echo "=== Build Size Report ==="
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "dist/ directory:"
          du -sh dist/ 2>/dev/null || echo "dist/ not found"
          echo ""
          echo "Detailed breakdown:"
          du -sh dist/*/ 2>/dev/null || echo "No subdirectories in dist/"
          echo ""
          echo "Total files count:"
          find dist/ -type f 2>/dev/null | wc -l || echo "0"

  e2e-tests:
    name: E2E Tests (Playwright - Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Don't cancel other shards on failure — useful for debugging flaky tests
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: |
          supabase start
          supabase db reset

      - name: Extract Supabase Keys
        # Supabase CLI 每次启动生成随机的 JWT_SECRET，不能使用固定 demo key。
        # 从 supabase status 文本输出提取实际密钥（新 CLI 用 sb_publishable_/sb_secret_，
        # 旧 CLI 用 JWT eyJ... 格式），写入 .env.development.local 供 api/supabase.ts 加载。
        run: |
          STATUS_TEXT=$(supabase status)

          # 新版 CLI 格式：sb_publishable_ / sb_secret_ 密钥（表格中显示）
          ANON_KEY=$(echo "$STATUS_TEXT" | grep -oP 'sb_publishable_[A-Za-z0-9_-]+' | head -1)
          SERVICE_KEY=$(echo "$STATUS_TEXT" | grep -oP 'sb_secret_[A-Za-z0-9_-]+' | head -1)

          # 旧版 CLI 格式：JWT 密钥（eyJ...），带 "anon key:" / "service_role key:" 标签
          if [ -z "$ANON_KEY" ]; then
            ANON_KEY=$(echo "$STATUS_TEXT" | grep -i 'anon' | grep -oP 'eyJ[A-Za-z0-9._-]+' | head -1)
          fi
          if [ -z "$SERVICE_KEY" ]; then
            SERVICE_KEY=$(echo "$STATUS_TEXT" | grep -i 'service' | grep -oP 'eyJ[A-Za-z0-9._-]+' | head -1)
          fi

          if [ -z "$SERVICE_KEY" ]; then
            echo "ERROR: 无法提取 service role key"
            echo "=== supabase status output ==="
            echo "$STATUS_TEXT"
            exit 1
          fi

          echo "ANON_KEY length: ${#ANON_KEY}"
          echo "SERVICE_KEY length: ${#SERVICE_KEY}"
          echo "ANON_KEY prefix: ${ANON_KEY:0:15}"
          echo "SERVICE_KEY prefix: ${SERVICE_KEY:0:15}"

          # 从 Docker 容器提取 JWT_SECRET（新 CLI 不在 status 输出中显示）
          # 遍历所有运行中的容器，找到包含 JWT_SECRET 环境变量的容器
          JWT_SECRET=""
          for container in $(docker ps --format "{{.Names}}"); do
            secret=$(docker exec "$container" printenv JWT_SECRET 2>/dev/null || echo "")
            if [ -n "$secret" ]; then
              JWT_SECRET="$secret"
              echo "Found JWT_SECRET in container: $container"
              break
            fi
          done
          if [ -n "$JWT_SECRET" ]; then
            echo "JWT_SECRET length: ${#JWT_SECRET}"
          else
            echo "JWT_SECRET: not found (auth API JWT verification may be limited)"
          fi

          # 写入 GITHUB_ENV 供后续步骤使用
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV
          if [ -n "$JWT_SECRET" ]; then
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET" >> $GITHUB_ENV
          fi

          # 写入 .env.development.local 供 API 服务器的 dotenv 加载
          # （api/supabase.ts 以 override:true 加载 .env.development.local，
          #   覆盖 .env.development 中的固定密钥）
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" > .env.development.local
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> .env.development.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> .env.development.local
          if [ -n "$JWT_SECRET" ]; then
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET" >> .env.development.local
          fi

      - name: Run E2E Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          DISABLE_RATE_LIMIT: 'true'
          TEST_USER_EMAIL: test@example.com
          TEST_USER_PASSWORD: test123456
          # 可选：配置真实 AI key 以运行 @integration 标记的深度集成测试
          # 未配置时，E2E 测试使用 Playwright route mock（e2e/helpers/aiMock.ts）
          # ALIYUN_API_KEY: ${{ secrets.ALIYUN_API_KEY }}
          # EMBEDDING_PROVIDER: aliyun

      - name: Upload Blob Report (Shard ${{ matrix.shardIndex }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 7

      - name: Upload Test Screenshots (Shard ${{ matrix.shardIndex }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7

  merge-reports:
    name: Merge E2E Reports
    if: always()
    needs: [e2e-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download All Blob Reports
        uses: actions/download-artifact@v4
        with:
          # Match all blob-report-* artifacts and unpack them into ./blob-report
          pattern: blob-report-*
          merge-multiple: true
          path: blob-report

      - name: Merge Blob Reports into HTML
        run: npx playwright merge-reports --reporter html ./blob-report

      - name: Upload Merged HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: playwright-report
          retention-days: 30

  flaky-detection:
    name: Flaky Test Detection
    # Runs weekly on Sunday 02:00 UTC + manual trigger
    # Repeats each E2E test 3 times to surface flaky tests.
    # Quarantine flaky tests by moving them to e2e/quarantine/ (see e2e/quarantine/.gitkeep).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests (repeat-each=3 for flaky detection)
        run: npm run test:flaky

      - name: Upload Flaky Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-report
          path: playwright-report/
          retention-days: 30
