﻿name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate (Lint, Typecheck, Test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check (Web)
        run: npm run check

      - name: Type Check (Electron)
        run: npm run check:electron

      - name: Security Audit
        continue-on-error: true
        run: npm audit

      - name: Run Tests
        run: npm test -- run

      - name: Build
        run: npm run build

      - name: Build Size Report
        run: |
          echo "=== Build Size Report ==="
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "dist/ directory:"
          du -sh dist/ 2>/dev/null || echo "dist/ not found"
          echo ""
          echo "Detailed breakdown:"
          du -sh dist/*/ 2>/dev/null || echo "No subdirectories in dist/"
          echo ""
          echo "Total files count:"
          find dist/ -type f 2>/dev/null | wc -l || echo "0"

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7

