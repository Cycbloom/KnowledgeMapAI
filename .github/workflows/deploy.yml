# git push 自动部署到自建云服务器
#
# 触发：push 到 main 或手动运行 workflow_dispatch。
# 流程：在 GitHub-hosted runner 上：
#   1) 构建 Web 生产产物（dist/，mode=production）
#   2) 把 Web 产物打成独立 tarball（避免后续 APK 构建覆盖 dist/ 造成串扰）
#   3) 构建 Android debug APK（JDK 17；android/gradle.properties 硬编码本机 JDK21，
#      这里用环境变量 JAVA_HOME 覆盖为 runner 的 JDK17）
#   4) 打包 web tarball + APK + latest.json → 经 stdin base64 送入专用部署账号入口脚本
#
# 首次启用需要的 GitHub 仓库 Secrets（Settings → Secrets and variables → Actions）：
#   SSH_HOST         服务器 IP（如 1.15.174.173）
#   SSH_USER         SSH 专用部署账号（固定为 lighthouse，切勿用 root）
#   SSH_PORT         SSH 端口（默认 22）
#   SSH_PRIVATE_KEY  lighthouse 的 SSH 私钥 PEM 内容（勿放 root 私钥）
#   SUPABASE_URL     https://supabase.cycbloom.cn
#   SUPABASE_ANON_KEY  移动端构建写 .env.mobile 用（公开 client key）
#   API_BASE_URL     https://api.cycbloom.cn/api/v1
#
# 安全说明：部署走专用账号 lighthouse，其 authorized_keys 强制 command= 跳转到
# /home/lighthouse/km-deploy-entry.sh：只接受 stdin 的 base64 负载、只写 /opt/km/web
# （保留 downloads）、拒绝 scp/任意远程命令。因此 CI 不再需要 root，也不执行任意 shell。
# .env.mobile 不入库，由 secrets 在 runner 上生成，含内容仅 client key。

name: Deploy to Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK (licenses + platform)
        # GitHub-hosted runner 已预装 Android SDK。不用 android-actions/setup-android：
        # 其在新版 cmdline-tools 下执行 'sdkmanager tools' 报 "Failed to find package 'tools'"
        # 而失败。这里手动接受许可证，并确保项目所需 platform/build-tools 存在（幂等）。
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" >/dev/null 2>&1 || true
          sdkmanager "build-tools;36.0.0" >/dev/null 2>&1 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null 2>&1 || true

      - name: Write mobile env
        # .env.mobile 未入库；由 CI 用 secrets 在 runner 上生成，
        # 供 mobile build 指向云端（与本地 .env.mobile 内容一致）
        run: |
          cat > .env.mobile <<'EOF'
          VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL=${{ secrets.API_BASE_URL }}
          VITE_OFFLINE_MODE=false
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build Web (production)
        run: npx vite build --mode production

      - name: Package Web dist tgz
        run: tar -czf web-dist.tgz -C dist .

      - name: Build Android debug APK
        # android/gradle.properties 指向本机 D:\jdk21，CI 上移除后用 setup-java 的 JDK21
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          # 1) git 检出在 Linux 上可能丢失 gradlew 的 exec 位（Windows core.filemode=false），
          #    显式补上，否则 run-gradlew.mjs 以 ./gradlew 方式执行会 Permission denied
          chmod +x android/gradlew
          # 2) gradle.properties 硬编码了本机 Windows 路径 org.gradle.java.home，
          #    它在 Linux runner 上无效且优先级高于 JAVA_HOME，必须移除让 gradle 用 JAVA_HOME
          sed -i '/^org.gradle.java.home=/d' android/gradle.properties
          npm run mobile:build:debug

      - name: Stage deploy bundle
        run: |
          mkdir -p bundle
          mv web-dist.tgz bundle/
          cp android/app/build/outputs/apk/debug/app-debug.apk bundle/knowledgemap.apk
          cp deploy/downloads/latest.json bundle/latest.json
          ls -la bundle/

      - name: Deploy via restricted lighthouse channel
        # 专用部署账号 lighthouse 的安全通道：服务器 authorized_keys 对 lighthouse 强制
        # command=/home/lighthouse/km-deploy-entry.sh，该入口脚本只接受 stdin 的 base64
        # 负载，仅允许写 /opt/km/web（保留 downloads）、拒绝 scp/任意远程命令。
        # 因此这里不再使用 root + scp + 任意 shell（避免 root 权限被 CI 滥用）。
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          key_file="$RUNNER_TEMP/km_deploy_key.pem"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          # bundle 已含 web-dist.tgz / knowledgemap.apk / latest.json（见上一 Stage 步骤）。
          # 打包成单个 tarball → 单行 base64 → 经 stdin 送入入口脚本（不指定远程命令，
          # 由 authorized_keys 的 command= 强制入口脚本执行）。
          tar -czf /tmp/km-bundle.tar.gz -C bundle .
          base64 -w0 /tmp/km-bundle.tar.gz | \
            ssh -i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=no \
                -o IdentitiesOnly=yes -p "$port" "${SSH_USER}@${SSH_HOST}"
          rm -f "$key_file"