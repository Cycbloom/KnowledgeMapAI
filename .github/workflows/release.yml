name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check (Web)
        run: npm run check

      - name: Type Check (Electron)
        run: npm run check:electron

      - name: Run Tests
        run: npm test -- run

  build-windows:
    name: Build Windows
    needs: validate
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron (Windows)
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release/*.exe
          retention-days: 5

  build-mac:
    name: Build macOS
    needs: validate
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron (macOS)
        run: npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 5

  build-linux:
    name: Build Linux
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Build Electron (Linux)
        run: npm run electron:build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/*.AppImage
            release/*.deb
          retention-days: 5

  release:
    name: Publish Release
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: release/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release/

      - name: List Release Files
        run: ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## KnowledgeMap ${{ github.ref_name }}

            ### 📥 下载安装

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Windows | `KnowledgeMap-*-x64-setup.exe` | NSIS 安装包 |
            | Windows | `KnowledgeMap-*-portable.exe` | 便携版（免安装） |
            | macOS | `KnowledgeMap-*-x64.dmg` | Intel 芯片 |
            | macOS | `KnowledgeMap-*-arm64.dmg` | Apple Silicon |
            | Linux | `KnowledgeMap-*-x64.AppImage` | AppImage 格式 |
            | Linux | `KnowledgeMap-*-x64.deb` | Debian/Ubuntu |

            ### 🚀 首次使用

            1. 安装并启动应用
            2. 按照引导向导注册 Supabase 账号
            3. 创建 Supabase 项目
            4. 输入连接凭证
            5. 初始化数据库
            6. 开始使用！

            ### 📝 更新内容

            请查看下方 commits 历史了解详细更新。
          draft: false
          prerelease: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
