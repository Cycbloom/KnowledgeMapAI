services:
  redis:
    image: redis:7-alpine
    container_name: knowledgemap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  tts-service:
    build:
      context: ./api/tts
      dockerfile: Dockerfile
    container_name: knowledgemap-tts
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - TTS_MODEL=Qwen/Qwen3-TTS-0.6B
      - TTS_VOICE=default
      - TTS_SPEED=1.0
      - TTS_OUTPUT_FORMAT=mp3
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - tts-models:/app/models
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    runtime: nvidia
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  redis-data:
    driver: local
  tts-models:
    driver: local